<!--
  INDRA STORMCORE — CELESTIAL THUNDER IDENTITY CARD
  CSS ONLY • NO JAVASCRIPT • 320 x 440
-->
<div
  class="spider-card"
  data-name="TEJAS HATEKAR"
  data-alias="The danger"
  data-github="tejashatekar22code"
  data-suit="#E62429"
>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap');

    .spider-card {
      --void: #02030a;
      --deep: #050816;
      --panel: #090b14;
      --cyan: #00e5ff;
      --violet: #8b5cf6;
      --magenta: #ec4899;
      --plasma: #ff1744;
      --fire: #ff6b00;
      --gold: #ffd166;
      --emerald: #00ff88;
      --white: #f8faff;

      width: 320px;
      height: 440px;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
      padding: 14px;

      font-family: "Rajdhani", sans-serif;
      color: var(--white);

      background:
        radial-gradient(circle at 50% 25%, rgba(0,229,255,.12), transparent 28%),
        radial-gradient(circle at 50% 55%, rgba(139,92,246,.10), transparent 40%),
        radial-gradient(circle at 20% 90%, rgba(255,60,0,.08), transparent 25%),
        linear-gradient(145deg, #02030a, #050816 55%, #090b14);

      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px;

      box-shadow:
        0 25px 70px rgba(0,0,0,.9),
        0 0 35px rgba(0,229,255,.08),
        inset 0 0 30px rgba(0,229,255,.03);

      transform-style: preserve-3d;

      transition:
        transform .7s cubic-bezier(.16,1,.3,1),
        box-shadow .7s ease;

      animation:
        boot 1.4s cubic-bezier(.16,1,.3,1) both,
        floatCard 7s ease-in-out 1.5s infinite;
    }

    /* =========================
       PREMIUM 3D HOVER
    ========================== */

    .spider-card:hover {
      transform:
        perspective(1200px)
        rotateX(5deg)
        rotateY(-6deg)
        translateY(-8px)
        scale(1.025);

      box-shadow:
        -18px 30px 65px rgba(0,0,0,.95),
        0 0 35px rgba(0,229,255,.28),
        0 0 70px rgba(139,92,246,.16),
        0 0 40px rgba(255,80,0,.08);
    }

    /* =========================
       INTELLIGENT BACKGROUND
    ========================== */

    .spider-card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;

      background:
        linear-gradient(rgba(0,229,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,.025) 1px, transparent 1px),
        radial-gradient(circle, rgba(255,255,255,.04) 1px, transparent 1.5px);

      background-size:
        22px 22px,
        22px 22px,
        38px 38px;

      opacity: .55;

      animation: gridMove 18s linear infinite;
    }

    /* HOLOGRAPHIC SCANNER */

    .spider-card::after {
      content: "";
      position: absolute;
      left: -50%;
      top: -10%;
      width: 55%;
      height: 130%;

      background:
        linear-gradient(
          105deg,
          transparent,
          rgba(0,229,255,.02),
          rgba(255,255,255,.10),
          rgba(0,229,255,.025),
          transparent
        );

      transform: skewX(-18deg);
      pointer-events: none;

      animation: scanner 7s ease-in-out infinite;
    }

    /* =========================
       HOLOGRAPHIC BORDER
    ========================== */

    .quantum-border {
      position: absolute;
      inset: 6px;
      border-radius: 13px;
      pointer-events: none;
      z-index: 2;

      background:
        linear-gradient(var(--void), var(--void)) padding-box,
        conic-gradient(
          from 0deg,
          transparent,
          var(--cyan),
          transparent,
          var(--violet),
          transparent,
          var(--fire),
          transparent,
          var(--cyan),
          transparent
        ) border-box;

      border: 1px solid transparent;

      opacity: .7;

      animation:
        borderEnergy 8s linear infinite,
        borderPulse 4s ease-in-out infinite;
    }

    /* =========================
       FIRE BACKGROUND
    ========================== */

    .fire-field {
      position: absolute;
      left: -10%;
      bottom: -45px;
      width: 120%;
      height: 120px;
      z-index: 1;
      pointer-events: none;

      filter: blur(2px);

      opacity: .7;
    }

    .flame {
      position: absolute;
      bottom: 0;
      width: 28px;
      height: 90px;

      border-radius:
        50% 50% 35% 35% /
        65% 65% 35% 35%;

      background:
        radial-gradient(circle at 50% 75%,
          #fff6b0 0%,
          var(--gold) 10%,
          #ff9d00 25%,
          var(--fire) 48%,
          var(--plasma) 70%,
          transparent 72%
        );

      filter:
        blur(4px)
        drop-shadow(0 0 10px var(--fire));

      transform-origin: bottom;

      animation: flameRise 3s ease-in-out infinite alternate;
    }

    .flame:nth-child(1) {
      left: 5%;
      height: 75px;
      animation-delay: .2s;
    }

    .flame:nth-child(2) {
      left: 18%;
      height: 105px;
      animation-delay: 1s;
    }

    .flame:nth-child(3) {
      left: 34%;
      height: 65px;
      animation-delay: .5s;
    }

    .flame:nth-child(4) {
      left: 48%;
      height: 115px;
      animation-delay: 1.5s;
    }

    .flame:nth-child(5) {
      left: 65%;
      height: 80px;
      animation-delay: .7s;
    }

    .flame:nth-child(6) {
      left: 80%;
      height: 105px;
      animation-delay: 1.8s;
    }

    /* =========================
       CONTENT
    ========================== */

    .card-content {
      position: relative;
      z-index: 5;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* =========================
       TOP SYSTEM BAR
    ========================== */

    .system-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;

      font-family: "Orbitron", sans-serif;
      font-size: 7px;
      letter-spacing: 1.1px;
    }

    .system-left {
      color: var(--cyan);
      text-shadow: 0 0 8px rgba(0,229,255,.7);
    }

    .neural-link {
      color: var(--emerald);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .neural-link::after {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 10px var(--emerald);

      animation: onlinePulse 1.5s infinite;
    }

    /* =========================
       CELESTIAL FACE ZONE
    ========================== */

    .artifact-zone {
      position: relative;
      height: 148px;
      margin-top: 2px;

      display: flex;
      justify-content: center;
      align-items: center;

      perspective: 900px;
      transform-style: preserve-3d;
    }

    /* ENERGY HALO */

    .halo {
      position: absolute;
      width: 145px;
      height: 145px;
      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(0,229,255,.16),
          rgba(139,92,246,.08) 38%,
          rgba(255,80,0,.04) 58%,
          transparent 72%
        );

      filter: blur(7px);

      animation: haloPulse 4s ease-in-out infinite;
    }

    /* ORBITS */

    .orbit {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(0,229,255,.25);
      transform-style: preserve-3d;
      pointer-events: none;
    }

    .orbit.one {
      width: 142px;
      height: 55px;
      transform: rotateX(70deg);
      box-shadow: 0 0 12px rgba(0,229,255,.25);
      animation: orbitOne 7s linear infinite;
    }

    .orbit.two {
      width: 115px;
      height: 48px;
      border-color: rgba(139,92,246,.4);
      transform: rotateX(58deg) rotateZ(50deg);
      animation: orbitTwo 9s linear infinite reverse;
    }

    .orbit.three {
      width: 152px;
      height: 62px;
      border-color: rgba(255,100,0,.2);
      transform: rotateY(68deg) rotateZ(20deg);
      animation: orbitThree 11s linear infinite;
    }

    /* =========================
       CELESTIAL HUMAN FACE
    ========================== */

    .celestial-face {
      position: relative;
      width: 88px;
      height: 108px;
      z-index: 4;

      transform-style: preserve-3d;

      filter:
        drop-shadow(0 0 12px rgba(0,229,255,.45))
        drop-shadow(0 0 25px rgba(139,92,246,.28));

      animation:
        faceFloat 5s ease-in-out infinite,
        faceEnergy 4s ease-in-out infinite;

      transition:
        transform .8s cubic-bezier(.16,1,.3,1),
        filter .6s ease;
    }

    .spider-card:hover .celestial-face {
      transform:
        scale(1.1)
        rotateY(8deg)
        rotateX(-4deg);

      filter:
        drop-shadow(0 0 18px var(--cyan))
        drop-shadow(0 0 35px var(--violet))
        drop-shadow(0 0 18px var(--fire));
    }

    /* FACE SHAPE */

    .face-main {
      position: absolute;
      inset: 8px 12px 4px;

      border-radius:
        48% 48% 45% 45% /
        40% 40% 60% 60%;

      background:
        radial-gradient(circle at 50% 30%,
          rgba(255,255,255,.92) 0%,
          rgba(160,220,255,.85) 18%,
          rgba(60,120,190,.55) 45%,
          rgba(15,25,55,.75) 72%,
          transparent 74%
        );

      box-shadow:
        inset 0 0 18px rgba(255,255,255,.25),
        inset 0 -15px 25px rgba(0,0,0,.45),
        0 0 22px rgba(0,229,255,.28);

      animation: faceGlow 3.5s ease-in-out infinite;
    }

    /* CROWN / DIVINE ENERGY */

    .crown {
      position: absolute;
      top: -4px;
      left: 50%;
      width: 68px;
      height: 32px;
      transform: translateX(-50%);

      clip-path:
        polygon(
          0 100%,
          8% 25%,
          25% 65%,
          40% 0,
          50% 60%,
          62% 0,
          75% 65%,
          92% 25%,
          100% 100%
        );

      background:
        linear-gradient(
          90deg,
          var(--violet),
          var(--cyan),
          white,
          var(--cyan),
          var(--violet)
        );

      filter:
        drop-shadow(0 0 8px var(--cyan))
        drop-shadow(0 0 15px var(--violet));

      animation: crownPulse 2.8s ease-in-out infinite;
    }

    /* FOREHEAD ENERGY MARK */

    .forehead-core {
      position: absolute;
      top: 28px;
      left: 50%;
      width: 7px;
      height: 18px;

      transform: translateX(-50%);

      border-radius: 50%;

      background:
        linear-gradient(
          to bottom,
          white,
          var(--cyan),
          var(--violet),
          transparent
        );

      box-shadow:
        0 0 8px white,
        0 0 18px var(--cyan);

      animation: thirdEnergy 2s ease-in-out infinite;
    }

    /* FACE CONTOUR */

    .face-main::before {
      content: "";
      position: absolute;
      inset: 10px;

      border-radius: inherit;

      background:
        linear-gradient(
          90deg,
          rgba(0,0,0,.45),
          transparent 30%,
          rgba(255,255,255,.16) 50%,
          transparent 70%,
          rgba(0,0,0,.45)
        );

      opacity: .8;
    }

    /* =========================
       DIVINE EYES
    ========================== */

    .eye {
      position: absolute;
      width: 21px;
      height: 8px;
      top: 53px;
      z-index: 8;

      border-radius: 50%;

      background:
        radial-gradient(
          ellipse,
          white 0%,
          #dfffff 12%,
          var(--cyan) 32%,
          var(--violet) 60%,
          transparent 75%
        );

      box-shadow:
        0 0 8px white,
        0 0 18px var(--cyan),
        0 0 30px var(--violet);

      animation:
        eyePulse 2s ease-in-out infinite,
        eyeFlicker 5s infinite;
    }

    .eye.left {
      left: calc(50% - 32px);
      transform: rotate(-8deg);
    }

    .eye.right {
      right: calc(50% - 32px);
      transform: rotate(8deg);
      animation-delay: .2s;
    }

    /* =========================
       GOD-LIKE LIGHTNING EYES
    ========================== */

    .lightning {
      position: absolute;
      top: 58px;
      width: 7px;
      height: 78px;
      z-index: 7;

      background:
        linear-gradient(
          to bottom,
          white 0%,
          #dfffff 12%,
          var(--cyan) 35%,
          var(--violet) 60%,
          transparent 100%
        );

      clip-path:
        polygon(
          45% 0%,
          95% 8%,
          50% 22%,
          85% 32%,
          28% 46%,
          72% 60%,
          32% 76%,
          55% 100%,
          0 82%,
          22% 62%,
          0 45%,
          30% 28%,
          0 12%
        );

      filter:
        drop-shadow(0 0 3px white)
        drop-shadow(0 0 9px var(--cyan))
        drop-shadow(0 0 20px var(--violet));

      transform-origin: top;

      animation:
        lightningFlash 2.5s infinite steps(1),
        lightningShake .25s infinite alternate;
    }

    .bolt-left {
      left: calc(50% - 37px);
      transform: rotate(15deg);
    }

    .bolt-right {
      right: calc(50% - 37px);
      transform: rotate(-15deg);
      animation-delay: .55s;
    }

    /* EXTRA BRANCH LIGHTNING */

    .bolt-small {
      position: absolute;
      top: 72px;
      width: 4px;
      height: 55px;
      z-index: 6;

      background:
        linear-gradient(
          to bottom,
          white,
          var(--cyan),
          transparent
        );

      clip-path:
        polygon(
          50% 0,
          100% 20%,
          35% 42%,
          90% 58%,
          35% 100%,
          0 75%,
          35% 48%,
          0 20%
        );

      filter:
        drop-shadow(0 0 7px var(--cyan));

      animation: secondaryBolt 3.7s infinite;
    }

    .small-left {
      left: calc(50% - 51px);
      transform: rotate(30deg);
    }

    .small-right {
      right: calc(50% - 51px);
      transform: rotate(-30deg);
      animation-delay: 1.1s;
    }

    /* =========================
       IDENTITY
    ========================== */

    .identity {
      text-align: center;
      margin-top: -5px;
    }

    .alias {
      margin: 0;

      font-family: "Orbitron", sans-serif;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 2px;

      color: var(--white);

      text-shadow:
        -1px 0 var(--cyan),
        1px 0 var(--magenta),
        0 0 16px rgba(0,229,255,.55);

      transition:
        letter-spacing .5s ease,
        text-shadow .5s ease,
        transform .5s ease;
    }

    .spider-card:hover .alias {
      letter-spacing: 3px;
      transform: translateY(-2px);

      text-shadow:
        -2px 0 var(--cyan),
        2px 0 var(--magenta),
        0 0 24px var(--cyan),
        0 0 38px var(--violet);
    }

    .name {
      margin-top: 3px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .8px;
      color: rgba(248,250,255,.88);

      transition: transform .5s ease;
    }

    .spider-card:hover .name {
      transform: translateX(2px);
    }

    .handle {
      margin-top: 1px;

      font-family: ui-monospace, monospace;
      font-size: 9px;

      color: var(--cyan);

      text-shadow: 0 0 8px rgba(0,229,255,.45);

      transition:
        letter-spacing .5s ease,
        text-shadow .5s ease;
    }

    .spider-card:hover .handle {
      letter-spacing: .5px;
      text-shadow:
        0 0 10px var(--cyan),
        0 0 20px rgba(0,229,255,.5);
    }

    /* =========================
       DIVIDER
    ========================== */

    .divider {
      height: 1px;
      margin: 10px 10px 8px;

      background:
        linear-gradient(
          90deg,
          transparent,
          var(--cyan),
          white,
          var(--violet),
          transparent
        );

      box-shadow: 0 0 8px var(--cyan);

      animation: dividerPulse 3s ease-in-out infinite;
    }

    /* =========================
       CAPABILITY MATRIX
    ========================== */

    .stats-container {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .stat-row {
      transition: transform .4s ease;
    }

    .stat-row:hover {
      transform: translateX(4px);
    }

    .stat-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 3px;

      font-size: 8px;
      letter-spacing: 1px;
      color: rgba(248,250,255,.58);
    }

    .stat-label span:last-child {
      font-family: "Orbitron", sans-serif;
      font-size: 8px;
      color: var(--cyan);
    }

    .stat-bar-bg {
      position: relative;
      height: 5px;
      overflow: hidden;

      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 5px;
    }

    .stat-bar-fill {
      position: relative;
      height: 100%;
      border-radius: inherit;

      background:
        linear-gradient(
          90deg,
          var(--violet),
          var(--cyan),
          var(--white)
        );

      box-shadow:
        0 0 9px var(--cyan);

      animation: energyPulse 2.5s ease-in-out infinite;
    }

    .stat-bar-fill::after {
      content: "";
      position: absolute;
      top: 0;
      left: -35%;
      width: 25%;
      height: 100%;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.9),
          transparent
        );

      transform: skewX(-20deg);

      animation: shimmer 2.8s linear infinite;
    }

    /* =========================
       DATA GRID
    ========================== */

    .data-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;

      margin-top: 9px;
    }

    .data-box {
      padding: 5px 3px;
      text-align: center;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.05),
          rgba(255,255,255,.012)
        );

      border: 1px solid rgba(255,255,255,.08);
      border-radius: 5px;

      backdrop-filter: blur(5px);

      transition:
        transform .4s ease,
        border-color .4s ease,
        box-shadow .4s ease;
    }

    .data-box:hover {
      transform:
        translateY(-3px)
        scale(1.04);

      border-color: rgba(0,229,255,.5);

      box-shadow:
        0 0 15px rgba(0,229,255,.18);
    }

    .data-key {
      display: block;
      font-size: 6px;
      letter-spacing: .7px;
      color: rgba(248,250,255,.4);
    }

    .data-value {
      display: block;
      margin-top: 2px;

      font-family: "Orbitron", sans-serif;
      font-size: 6px;
      color: var(--cyan);
    }

    /* =========================
       FOOTER
    ========================== */

    .system-footer {
      margin-top: auto;
      padding-top: 8px;

      border-top:
        1px dashed rgba(255,255,255,.1);

      display: flex;
      justify-content: space-between;
      align-items: center;

      font-family: "Orbitron", sans-serif;
      font-size: 7px;
      letter-spacing: .8px;
    }

    .system-tag {
      color: rgba(248,250,255,.4);
    }

    .status-active {
      display: flex;
      align-items: center;
      gap: 4px;

      color: var(--emerald);

      text-shadow:
        0 0 8px rgba(0,255,136,.5);
    }

    .status-active::after {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;

      background: var(--emerald);

      box-shadow:
        0 0 9px var(--emerald);

      animation: onlinePulse 1.4s infinite;
    }

    /* =========================
       KEYFRAMES
    ========================== */

    @keyframes boot {
      0% {
        opacity: 0;
        filter: blur(14px);
        transform: translateY(35px) scale(.88);
      }

      70% {
        opacity: 1;
        filter: blur(0);
      }

      100% {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0) scale(1);
      }
    }

    @keyframes floatCard {
      0%,100% { translate: 0 0; }
      50% { translate: 0 -4px; }
    }

    @keyframes gridMove {
      from {
        background-position: 0 0,0 0,0 0;
      }

      to {
        background-position: 22px 22px,-22px 22px,38px 38px;
      }
    }

    @keyframes scanner {
      0%,20% {
        transform: translateX(-160%) skewX(-18deg);
        opacity: 0;
      }

      35% { opacity: .8; }

      55% {
        transform: translateX(350%) skewX(-18deg);
        opacity: .4;
      }

      100% {
        transform: translateX(350%) skewX(-18deg);
        opacity: 0;
      }
    }

    @keyframes borderEnergy {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(45deg); }
    }

    @keyframes borderPulse {
      0%,100% { opacity: .45; }
      50% { opacity: .9; }
    }

    @keyframes flameRise {
      0% {
        transform: scaleY(.75) scaleX(.9) rotate(-3deg);
        opacity: .45;
      }

      50% {
        transform: scaleY(1.2) scaleX(1.05) rotate(4deg);
        opacity: .9;
      }

      100% {
        transform: scaleY(.85) scaleX(.85) rotate(-2deg);
        opacity: .6;
      }
    }

    @keyframes haloPulse {
      0%,100% {
        transform: scale(.85);
        opacity: .55;
      }

      50% {
        transform: scale(1.15);
        opacity: 1;
      }
    }

    @keyframes orbitOne {
      to { rotate: 360deg; }
    }

    @keyframes orbitTwo {
      to { rotate: -360deg; }
    }

    @keyframes orbitThree {
      to { rotate: 360deg; }
    }

    @keyframes faceFloat {
      0%,100% {
        translate: 0 -2px;
      }

      50% {
        translate: 0 5px;
      }
    }

    @keyframes faceEnergy {
      0%,100% {
        filter:
          drop-shadow(0 0 10px rgba(0,229,255,.4))
          drop-shadow(0 0 20px rgba(139,92,246,.2));
      }

      50% {
        filter:
          drop-shadow(0 0 18px var(--cyan))
          drop-shadow(0 0 35px var(--violet));
      }
    }

    @keyframes faceGlow {
      0%,100% {
        filter: brightness(.9);
      }

      50% {
        filter: brightness(1.25);
      }
    }

    @keyframes crownPulse {
      0%,100% {
        transform: translateX(-50%) scale(.92);
        opacity: .7;
      }

      50% {
        transform: translateX(-50%) scale(1.08);
        opacity: 1;
      }
    }
